[package]
name = "dcload-ip-rs"
description = "A Rust implementation of dcload-ip for Dreamcast"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 2
codegen-units = 1
lto = "fat"

[dependencies]
clap = { version = "4.5.55", features = ["derive"] }
clap-num = "1.2.0"
elf = "0.8.0"
indicatif = "0.18.3"
log = "0.4.29"
polling = "3.11.0"
pretty_env_logger = "0.5.0"
