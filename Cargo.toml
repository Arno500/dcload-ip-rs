[package]
name = "dcload-ip-rs"
description = "A Rust implementation of dcload-ip for Dreamcast"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 2
codegen-units = 1
lto = "fat"

# A DEBUG BUILD STILL HAS TO READ A DISC, and an unoptimised inflate makes that
# look like a slow network. Measured on the 1.10 GiB Sonic Adventure 2 track,
# over SMB: the release build indexes it in 4.6 s (inflate 3.73 s, crc 0.49 s),
# the stock debug build in 40.5 s (inflate 33.58 s, crc 6.30 s) -- 29 MiB/s,
# which is slow enough to look like the share is at fault. It is not: the
# reader threads waited 0.07 s in both.
#
# So the dependency that does the decoding is always optimised, and this crate
# is built at opt-level 1, which keeps line numbers and backtraces usable while
# making our own byte loops (CRC-32, descrambling) stop being the bottleneck.
[profile.dev]
opt-level = 1

[profile.dev.package.miniz_oxide]
opt-level = 3

[dependencies]
clap = { version = "4.5.58", features = ["derive"] }
clap-num = "1.2.0"
# Already in the tree as indicatif's own terminal backend; declared here so the
# progress display can ask how wide the terminal is before it picks a layout.
console = "0.16.2"
# Ctrl-C is how a session with a title normally ends -- the game is running,
# there is nothing to "finish" -- so it is the one ending worth reporting on.
# It is NOT what saves the learned memory map (src/memmap.rs): a debugger
# swallows SIGINT and a Stop button is a kill, so the file is kept current by a
# ticker instead. See memmap::install_signal_handler(). `termination` adds
# SIGTERM/SIGHUP and the Windows close/logoff events, which are the other
# endings that can still run code.
ctrlc = { version = "3.5.2", features = ["termination"] }
elf = "0.8.0"
indicatif = "0.18.3"
log = "0.4.29"
# DreamShell names its per-game presets after the MD5 of a disc's boot sector,
# so recognising a disc means computing the same hash. Not a security use.
md5 = "0.8.0"
# Inflate with RESTART POINTS. The `block-boundary` feature is what makes
# random access into a zipped disc image possible without unpacking it: it
# exposes the decoder state at a deflate block boundary, which is all a
# checkpoint needs. See src/disc_formats/deflate.rs.
miniz_oxide = { version = "0.9", features = ["block-boundary"] }
oxideav-adpcm = "0.0.7"
polling = "3.11.0"
pretty_env_logger = "0.5.0"

# ONLY for putting the terminal back after the diagnostic panel (src/ui.rs).
# `Term::read_key` holds the tty in raw mode across a blocking read, so a kill
# that is not Ctrl-C can leave a shell in raw mode; this is what restores it.
# Already in the lock file as console's own dependency, so it costs nothing new.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
